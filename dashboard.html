<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد شهروندی | کاشان سیتی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b13; --bg-2:#0c101c;
    --card:rgba(255,255,255,0.035); --card-strong:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.09);
    --cyan:#5cc9f5; --cyan-2:#8fe7ff; --gold:#f2c14e;
    --text:#f3f6fb; --text-dim:#8d95a9; --text-dim-2:#5c6478;
    --green:#7be3a3; --red:#f2789a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:radial-gradient(ellipse 1000px 600px at 90% -10%, #10203a 0%, transparent 60%), var(--bg);
    color:var(--text); font-family:'Vazirmatn',sans-serif; min-height:100vh;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .wrap{max-width:1300px; margin:0 auto; padding:24px 28px 60px;}

  /* header */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; background:var(--card); border:1px solid var(--border); border-radius:18px; margin-bottom:16px;}
  .user-chip{display:flex; align-items:center; gap:12px;}
  .avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#4a7c9e,#243b57); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#cfe9fb; border:1.5px solid rgba(255,255,255,0.18);}
  .user-chip .name{font-size:14px; font-weight:700;}
  .bell{width:36px; height:36px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
  .page-title{text-align:left;}
  .page-title h1{font-size:19px; font-weight:800;}
  .page-title small{font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px; justify-content:flex-end;}
  .logo-icon{width:26px; height:26px; border-radius:8px; background:linear-gradient(140deg,var(--gold),#b8842e); display:inline-flex; align-items:center; justify-content:center; font-weight:900; color:#221604; font-size:13px; margin-right:6px;}

  .announce{
    display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:12px 20px; margin-bottom:22px; font-size:13px; color:var(--text-dim);
  }
  .announce .pager{display:flex; align-items:center; gap:10px; color:var(--text-dim-2); font-size:12.5px;}
  .announce .pager button{color:var(--text-dim);}
  .announce .msg{display:flex; align-items:center; gap:8px;}

  /* layout */
  .dash-grid{display:grid; grid-template-columns:1fr 300px 220px; gap:16px; align-items:start;}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:26px; min-height:520px;}
  .panel h2{font-size:16px; font-weight:800; margin-bottom:4px;}
  .panel .sub{font-size:12.5px; color:var(--text-dim); margin-bottom:20px;}

  /* nav sidebar */
  .side-nav{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:2px; height:fit-content;}
  .side-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:12px;
    font-size:13.5px; font-weight:600; color:var(--text-dim); position:relative;
  }
  .side-item .l{display:flex; align-items:center; gap:10px;}
  .side-item:hover{background:rgba(255,255,255,0.04); color:var(--text);}
  .side-item.active{background:rgba(92,201,245,0.12); color:var(--cyan-2);}
  .side-item.active::before{content:""; position:absolute; right:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--cyan);}
  .side-badge{background:var(--red); color:#2a0410; font-size:10.5px; font-weight:800; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .side-sub{padding-right:30px; display:flex; flex-direction:column;}
  .side-sub .side-item{font-size:12.5px; padding:9px 14px;}
  .side-foot{display:flex; align-items:center; gap:8px; padding:12px 14px; margin-top:8px; border-top:1px solid var(--border); font-size:11px; color:var(--text-dim-2);}
  .new-pill{background:linear-gradient(95deg,#c58cf0,#8a5cf0); color:#fff; font-size:10px; font-weight:800; padding:3px 9px; border-radius:20px;}

  /* messages: conversation list */
  .list-panel{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px; height:fit-content;}
  .list-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .new-conv-btn{background:linear-gradient(95deg,var(--cyan-2),var(--cyan)); color:#03131d; font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:12px; display:flex; align-items:center; gap:6px;}
  .conv-item{display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; margin-bottom:6px;}
  .conv-item:hover{background:rgba(255,255,255,0.04);}
  .bot-avatar{width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#8a5cf0,#4a2c9e); display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; color:#fff;}
  .conv-item .info b{font-size:13.5px; display:block;}
  .conv-item .info span{font-size:11.5px; color:var(--text-dim);}
  .conv-empty{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px;}

  /* channel list */
  .ch-group-label{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); margin-bottom:10px;}
  .ch-count{background:rgba(92,201,245,0.15); color:var(--cyan-2); font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px;}
  .ch-item{display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; margin-bottom:4px;}
  .ch-item:hover{background:rgba(255,255,255,0.04);}
  .ch-hash{width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:13px; flex-shrink:0;}
  .ch-item .info{flex:1; min-width:0;}
  .ch-item .info b{font-size:13.5px; display:block;}
  .ch-item .info span{font-size:11.5px; color:var(--text-dim); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ch-meta{text-align:left; flex-shrink:0;}
  .ch-meta .day{font-size:10.5px; color:var(--text-dim-2); display:block; margin-bottom:4px;}
  .ch-unread{background:var(--cyan); color:#03131d; font-size:10px; font-weight:800; width:16px; height:16px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;}

  /* empty state (detail panel) */
  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; min-height:460px;}
  .empty-icon{width:64px; height:64px; border-radius:50%; background:rgba(92,201,245,0.1); border:1px solid rgba(92,201,245,0.25); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--cyan-2); margin-bottom:22px;}
  .empty-state h3{font-size:16px; font-weight:700; margin-bottom:10px;}
  .empty-state p{font-size:13px; color:var(--text-dim); max-width:280px; line-height:1.9; margin-bottom:22px;}
  .empty-btn{background:linear-gradient(95deg,var(--cyan-2),var(--cyan)); color:#03131d; font-size:13px; font-weight:700; padding:11px 20px; border-radius:12px;}

  /* tickets */
  .ticket-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .ticket-new{background:linear-gradient(95deg,var(--cyan-2),var(--cyan)); color:#03131d; font-size:13px; font-weight:700; padding:11px 18px; border-radius:12px; display:flex; align-items:center; gap:7px;}
  .search-box{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:14px; padding:13px 18px; margin-bottom:18px;}
  .search-box input{flex:1; background:none; border:none; color:var(--text); font-family:inherit; font-size:13.5px; outline:none; text-align:right;}
  .search-box input::placeholder{color:var(--text-dim-2);}
  .filter-tabs{display:flex; justify-content:flex-end; gap:8px; margin-bottom:20px;}
  .filter-tabs button{padding:9px 18px; border-radius:12px; font-size:12.5px; font-weight:700; border:1px solid var(--border); background:var(--card); color:var(--text-dim); display:flex; align-items:center; gap:6px;}
  .filter-tabs button.active{background:rgba(92,201,245,0.14); color:var(--cyan-2); border-color:rgba(92,201,245,0.35);}
  .count-chip{background:rgba(255,255,255,0.08); font-size:10.5px; padding:1px 7px; border-radius:20px;}
  .ticket-row{display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:14px; padding:16px 20px;}
  .status-open{background:rgba(123,227,163,0.15); color:var(--green); font-size:11.5px; font-weight:800; padding:5px 12px; border-radius:20px;}
  .ticket-id{font-size:12.5px; color:var(--text-dim);}
  .tag-pill{background:rgba(255,255,255,0.06); font-size:11.5px; padding:5px 12px; border-radius:10px; display:flex; align-items:center; gap:6px;}

  /* search citizens */
  .search-head{display:flex; align-items:center; gap:14px; margin-bottom:26px;}
  .back-btn{width:40px; height:40px; border-radius:12px; background:var(--cyan); color:#03131d; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .big-search{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:14px; padding:14px 18px; flex:1;}
  .big-search input{flex:1; background:none; border:none; color:var(--text); font-family:inherit; font-size:13.5px; outline:none; text-align:right;}
  .big-search input::placeholder{color:var(--text-dim-2);}

  @media (max-width:1080px){
    .dash-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="user-chip">
      <div class="avatar">مه</div>
      <div class="name">مهدی رستمی</div>
      <div class="bell">🔔</div>
    </div>
    <div class="page-title">
      <h1>داشبورد شهروندی</h1>
      <small id="crumb">پیام‌ها <span class="logo-icon">ک</span></small>
    </div>
  </div>

  <div class="announce">
    <div class="msg">📢 <span>اطلاعیه مهم و فنی: ارتقای سطح امنیت در کاشان سیتی</span></div>
    <div class="pager"><button>‹</button><span>1/3</span><button>›</button></div>
  </div>

  <div class="dash-grid">

    <!-- LEFT: detail / main content -->
    <div class="panel" id="mainPanel">
      <!-- filled by JS -->
    </div>

    <!-- MIDDLE: list -->
    <div class="list-panel" id="listPanel">
      <!-- filled by JS -->
    </div>

    <!-- RIGHT: nav -->
    <div class="side-nav" id="sideNav">
      <div class="side-item" data-view="info"><span class="l">👤 اطلاعات من</span></div>
      <div class="side-item active" data-view="messages"><span class="l">💬 پیام‌ها</span></div>
      <div class="side-item" data-view="channels"><span class="l"># چنل‌ها</span><span class="side-badge">2</span></div>
      <div class="side-item" data-view="tickets"><span class="l">🎫 سیستم تیکت</span></div>
      <div class="side-item" data-view="shop"><span class="l">🛍 فروشگاه</span></div>
      <div class="side-item" data-view="gallery"><span class="l">📷 گالری</span></div>
      <div class="side-item" data-view="wallet"><span class="l">💳 کیف پول</span></div>
      <div class="side-item" data-view="logs"><span class="l">📄 لاگ‌ها</span></div>
      <div class="side-item" data-view="search"><span class="l">🔍 جستجوی شهروندان</span></div>
      <div class="side-item" data-view="stream"><span class="l">📹 پنل استریمر</span></div>
      <div class="side-item" data-view="settings"><span class="l">⚙️ تنظیمات</span></div>
      <div class="side-item" data-view="feedback"><span class="l">💬 ارسال بازخورد</span></div>
      <div class="side-foot"><span class="new-pill">جدید</span> ↻ v1.0.0</div>
    </div>

  </div>
</div>

<script>
const crumb = document.getElementById('crumb');
const mainPanel = document.getElementById('listPanel');
const detail = document.getElementById('mainPanel');
const sideNav = document.getElementById('sideNav');

function setActive(view){
  document.querySelectorAll('.side-item[data-view]').forEach(el=>{
    el.classList.toggle('active', el.dataset.view===view);
  });
}

function emptyState(title, desc, btn){
  return `<div class="empty-state">
    <div class="empty-icon">💬</div>
    <h3>${title}</h3>
    <p>${desc}</p>
    ${btn? `<button class="empty-btn">${btn}</button>`:''}
  </div>`;
}

const views = {
  messages(){
    crumb.innerHTML = 'پیام‌ها <span class="logo-icon">ک</span>';
    detail.innerHTML = emptyState('گفتگویی انتخاب نشده','یک گفتگو را از فهرست انتخاب کنید یا گفتگوی جدیدی با یکی از مدیران شروع کنید','+ گفتگوی جدید');
    mainPanel.innerHTML = `
      <div class="list-head"><h2 style="font-size:14px;">گفتگوها</h2><button class="new-conv-btn">+ گفتگوی جدید</button></div>
      <div class="conv-item">
        <div class="bot-avatar">BOT</div>
        <div class="info"><b>سیستم کاشان سیتی</b><span>اعلان‌های رسمی سایت</span></div>
      </div>
      <div class="conv-empty">
        <div style="font-size:13px; margin-bottom:14px;">هنوز گفتگویی ندارید</div>
        <button class="new-conv-btn" style="margin:0 auto;">+ شروع گفتگو با یک مدیر</button>
      </div>`;
  },
  channels(){
    crumb.innerHTML = 'چنل‌ها <span class="logo-icon">ک</span>';
    detail.innerHTML = emptyState('گفتگویی انتخاب نشده','یک چنل را از فهرست انتخاب کنید تا پیام‌های آن را ببینید','');
    mainPanel.innerHTML = `
      <div class="list-head"><h2 style="font-size:14px;">چنل‌های من</h2></div>
      <div class="ch-group-label"><span class="ch-count">3</span> چنل‌های عمومی #</div>
      <div class="ch-item">
        <div class="ch-hash">#</div>
        <div class="info"><b>اطلاع‌رسانی‌های مهم</b><span>اطلاعیه‌ی مهم از تاریخ ۳ مرداد...</span></div>
        <div class="ch-meta"><span class="day">۱۱ روز</span><span class="ch-unread">۱</span></div>
      </div>
      <div class="ch-item">
        <div class="ch-hash">#</div>
        <div class="info"><b>اطلاع‌رسانی‌های تیم فنی</b><span>اطلاعیه‌ی خارج شدن سرور از...</span></div>
        <div class="ch-meta"><span class="day">۲ روز</span><span class="ch-unread">۲</span></div>
      </div>
      <div class="ch-item">
        <div class="ch-hash">#</div>
        <div class="info"><b>اطلاع از تغییرات</b><span>به‌روزرسانی‌های جدید - بهروز...</span></div>
        <div class="ch-meta"><span class="day">۳ روز</span><span class="ch-unread">۱</span></div>
      </div>`;
  },
  tickets(){
    crumb.innerHTML = 'سیستم تیکت <span class="logo-icon">ک</span>';
    detail.innerHTML = `
      <div class="ticket-top">
        <button class="ticket-new">+ تیکت جدید</button>
        <h2>سیستم تیکت 🎫</h2>
      </div>
      <div class="search-box">🔍<input placeholder="شماره تیکت را وارد کنید..."></div>
      <div class="filter-tabs">
        <button>بسته <span class="count-chip">2</span></button>
        <button class="active">باز <span class="count-chip">1</span></button>
      </div>
      <div class="ticket-row">
        <span class="tag-pill">💬 gang</span>
        <div style="text-align:center;"><span class="ticket-id">۱۴۰۵/۶/۱</span></div>
        <div><span class="status-open">باز</span> <span class="ticket-id">#۶۶۰۸۲</span></div>
      </div>`;
    mainPanel.innerHTML = `<div class="empty-state" style="min-height:460px;"><p style="color:var(--text-dim-2); font-size:12.5px;">راهنما: برای پیگیری سریع‌تر، شماره‌ی تیکت خود را در نوار جستجو وارد کنید.</p></div>`;
  },
  search(){
    crumb.innerHTML = 'جستجوی شهروندان <span class="logo-icon">ک</span>';
    detail.innerHTML = `
      <div class="search-head">
        <div class="back-btn">←</div>
        <div class="big-search">🔍<input placeholder="نام، شماره تلفن یا استیم هگز شهروند را وارد کنید..."></div>
      </div>
      <div class="empty-state" style="min-height:380px;">
        <div class="empty-icon">🔍</div>
        <p>برای جستجو، نام، شماره تلفن یا استیم هگز شهروند را وارد کنید</p>
      </div>`;
    mainPanel.innerHTML = `
      <div class="side-sub">
        <div class="side-item active" style="font-size:13px;"><span class="l">🔍 جستجو</span></div>
        <div class="side-item" style="font-size:13px;"><span class="l">👥 شهروندان مورد علاقه</span></div>
      </div>`;
  },
  info(){ genericView('اطلاعات من','اطلاعات حساب کاربری و کاراکترهای شما اینجا نمایش داده می‌شود.'); },
  shop(){ genericView('فروشگاه','خرید خودرو، ملک و آیتم از فروشگاه رسمی کاشان سیتی.'); },
  gallery(){ genericView('گالری','عکس‌ها و لحظات ثبت‌شده از شهر کاشان.'); },
  wallet(){ genericView('کیف پول','موجودی و تراکنش‌های اقتصادی کاراکتر شما.'); },
  logs(){ genericView('لاگ‌ها','تاریخچه‌ی فعالیت‌های حساب شما.'); },
  stream(){ genericView('پنل استریمر','مدیریت پخش زنده و اتصال به کانال‌های استریم.'); },
  settings(){ genericView('تنظیمات','تنظیمات حساب کاربری و اعلان‌ها.'); },
  feedback(){ genericView('ارسال بازخورد','نظرات و پیشنهادهای خود را با تیم کاشان سیتی در میان بگذارید.'); }
};

function genericView(title, desc){
  crumb.innerHTML = title + ' <span class="logo-icon">ک</span>';
  detail.innerHTML = emptyState(title, desc, '');
  mainPanel.innerHTML = `<div class="empty-state" style="min-height:460px;"><p>این بخش به‌زودی تکمیل می‌شود.</p></div>`;
}

sideNav.addEventListener('click', (e)=>{
  const item = e.target.closest('.side-item[data-view]');
  if(!item) return;
  const view = item.dataset.view;
  setActive(view);
  (views[view] || views.info)();
});

views.messages();
</script>

</body>
</html>
